name: Cross-browser Change review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: ${{ matrix.engine }} on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    env:
      MORPH_BROWSER_ENGINE: ${{ matrix.engine }}
      MORPH_VIBECHECK_REPO: ${{ github.workspace }}/.ci/VibeCheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check out the pinned VibeCheck product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: marioG1025/VibeCheck
          ref: 6a2349d6ac2cb80ec5b32d46dee04b8f7d7bfb24
          path: .ci/VibeCheck
          persist-credentials: false
      - name: Install the locked runtime and browser
        shell: bash
        run: |
          npm ci --prefix runtime --omit=dev --ignore-scripts
          cd tests/browser
          npm ci --ignore-scripts
          npx playwright install --with-deps "$MORPH_BROWSER_ENGINE"
      - name: Approve, compare, restore and save in two open tabs
        id: acceptance
        shell: bash
        working-directory: tests/browser
        run: |
          set -o pipefail
          npm run test:acceptance | tee "$RUNNER_TEMP/morph-acceptance.tap"
      - name: Record browser and platform
        if: always()
        shell: bash
        env:
          ACCEPTANCE_RESULT: ${{ steps.acceptance.outcome }}
        run: |
          . /etc/os-release
          {
            printf '### %s on %s\n\n' "$MORPH_BROWSER_ENGINE" "$PRETTY_NAME"
            printf 'Acceptance outcome: **%s**\n\n' "$ACCEPTANCE_RESULT"
            if test -f tests/browser/node_modules/playwright/package.json; then
              printf 'Playwright %s\n\n' "$(node -p "require('./tests/browser/node_modules/playwright/package.json').version")"
            fi
            if test -f "$RUNNER_TEMP/morph-acceptance.tap"; then
              sed -n 's/^# \(Browser runtime .*\)/\1/p' "$RUNNER_TEMP/morph-acceptance.tap"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
