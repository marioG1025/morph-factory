name: LLP Go host parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/interop.yml"
      - "scripts/interop/**"
      - "ui/layers/*.wasm"
      - "runtime/review-host.mjs"
      - "runtime/layers/*.wasm"
      - "runtime/vendor/llp/**"

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.2"
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Replay signed factory releases through both client hosts
        run: python3 scripts/interop/run.py
