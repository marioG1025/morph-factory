name: Source ZIP acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-release:
    name: First launch on ${{ matrix.os }} with ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            engine: webkit
          - os: ubuntu-24.04
            engine: firefox
          - os: windows-latest
            engine: chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MORPH_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Package this exact source commit
        shell: bash
        run: git archive --format=zip --prefix=morph-factory/ --output="$RUNNER_TEMP/Morph Factory.zip" HEAD
      - name: Prepare the test browser
        shell: bash
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps "$MORPH_BROWSER_ENGINE"
      - name: Launch, compare, save, restart and inspect the clean checkout
        timeout-minutes: 5
        shell: bash
        run: node scripts/packaging/verify-zip.mjs --archive "$RUNNER_TEMP/Morph Factory.zip" --revision "$GITHUB_SHA"
      - name: Open the standalone replay with the network disconnected
        timeout-minutes: 2
        run: node --test tests/browser/replay.test.mjs
